<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Magic Library</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f6e7c8;
      --ink-soft: rgba(246, 231, 200, 0.72);
      --night: #0d1226;
      --amber: #f2c46b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); overflow: hidden; }
    body { font-family: "IM Fell English", Georgia, serif; }
    body.lang-zh { font-family: "Songti SC", "STSong", "Noto Serif SC", serif; }
    body.lang-zh .title { letter-spacing: 0.4em; }
    canvas#room { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    /* 魔法棒光标：杖尖（左上角的金星）就是点击点；指到能点的书时杖尖亮起来 */
    canvas#room { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><line x1='29' y1='30' x2='9' y2='10' stroke='%233a2416' stroke-width='4' stroke-linecap='round'/><line x1='29' y1='30' x2='23' y2='24' stroke='%23d9b25f' stroke-width='4' stroke-linecap='round'/><path d='M6 0 L7.6 4.4 L12 6 L7.6 7.6 L6 12 L4.4 7.6 L0 6 L4.4 4.4 Z' fill='%23ffd878' stroke='%237a5a20' stroke-width='0.7'/></svg>") 6 6, crosshair; }
    canvas#room.over-book { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><circle cx='6' cy='6' r='6' fill='%23fff4c8' opacity='0.7'/><line x1='29' y1='30' x2='9' y2='10' stroke='%233a2416' stroke-width='4' stroke-linecap='round'/><line x1='29' y1='30' x2='23' y2='24' stroke='%23d9b25f' stroke-width='4' stroke-linecap='round'/><path d='M6 -1 L8 4 L13 6 L8 8 L6 13 L4 8 L-1 6 L4 4 Z' fill='%23ffffff' stroke='%23d9b25f' stroke-width='0.8'/></svg>") 6 6, pointer; }
    /* 仙尘拖尾叠加层：在画面之上、按钮之下，不挡点击 */
    .sparkles { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

    .title {
      position: fixed; top: 22px; left: 0; right: 0; text-align: center; pointer-events: none;
      animation: title-rest 1.2s ease 4s forwards;
      letter-spacing: 0.12em; font-size: 26px; text-shadow: 0 0 18px rgba(242, 196, 107, 0.55);
    }
    .hint {
      position: fixed; bottom: 28px; left: 0; right: 0; text-align: center; pointer-events: none;
      font-size: 16px; color: var(--ink-soft); letter-spacing: 0.04em;
      transition: opacity 0.8s;
    }
    @keyframes title-rest { to { opacity: 0.45; } }
    .tagline {
      position: fixed; top: 58px; left: 0; right: 0; text-align: center; pointer-events: none;
      font-style: italic; font-size: 15px; letter-spacing: 0.06em; color: var(--ink-soft);
      animation: title-rest 1.2s ease 4s forwards;
    }
    body.lang-zh .tagline { font-style: normal; letter-spacing: 0.2em; }
    /* 书区名缎带：每个书区一个主题色（--section-color），两端燕尾，正对哪面墙就显示哪面 */
    .wall-name {
      position: fixed; top: 88px; left: 50%; transform: translateX(-50%) translateY(-6px);
      pointer-events: none; white-space: nowrap;
      display: flex; align-items: center; gap: 12px;
      padding: 8px 40px; min-width: 220px; justify-content: center;
      font-family: "IM Fell English SC", "IM Fell English", Georgia, serif;
      font-size: 26px; letter-spacing: 0.08em; color: var(--section-color, var(--amber));
      background: rgba(22, 14, 30, 0.82);
      border-top: 2px solid var(--section-color, var(--amber));
      border-bottom: 2px solid var(--section-color, var(--amber));
      clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 50%, 100% 100%, 0 100%, 18px 50%);
      text-shadow: 0 0 14px color-mix(in srgb, var(--section-color, #f2c46b) 60%, transparent);
      opacity: 0; transition: opacity 0.35s, transform 0.35s, color 0.35s, border-color 0.35s;
    }
    .wall-name.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .wall-name .icon { font-size: 22px; opacity: 0.9; }
    body.lang-zh .wall-name { font-family: "Songti SC", "STSong", serif; font-weight: bold; letter-spacing: 0.3em; font-size: 24px; }
    .toast {
      position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
      background: rgba(13, 18, 38, 0.78); border: 1px solid rgba(242, 196, 107, 0.4);
      padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity 0.4s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* 复古画面质感：四周暗角 + 一层淡淡的纸纹（不挡点击） */
    .vignette {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 38%, rgba(10,6,16,0.6) 75%, rgba(10,6,16,0.92) 100%);
    }
    .grain {
      position: fixed; inset: -50%; pointer-events: none; opacity: 0.09; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* 书架模式：左上角返回按钮 + 顶部书区名 */
    .back {
      position: fixed; top: 18px; left: 16px; z-index: 3;
      font: inherit; font-size: 15px; color: var(--ink); letter-spacing: 0.1em;
      background: rgba(40, 24, 16, 0.78); border: 1px solid rgba(242, 196, 107, 0.55);
      padding: 8px 16px; border-radius: 999px; cursor: pointer;
    }
    .back:hover { background: rgba(60, 36, 22, 0.9); }
    .section-title {
      position: fixed; top: 86px; left: 0; right: 0; text-align: center; pointer-events: none;
      font-size: 20px; letter-spacing: 0.1em; color: var(--amber);
    }
    /* 右上角：音乐开关 + 语言切换 */
    .top-right { position: fixed; top: 18px; right: 16px; z-index: 3; display: flex; gap: 8px; }
    .music.off { opacity: 0.45; text-decoration: line-through; }
    .lang, .music {
      font: inherit; font-size: 14px; color: var(--ink); letter-spacing: 0.05em;
      background: rgba(40, 24, 16, 0.78); border: 1px solid rgba(242, 196, 107, 0.55);
      padding: 6px 14px; border-radius: 999px; cursor: pointer;
    }
    .lang:hover { background: rgba(60, 36, 22, 0.9); }
    .level {
      position: fixed; top: 60px; right: 16px; z-index: 3;
      font: inherit; font-size: 13px; letter-spacing: 0.1em; color: var(--ink);
      background: rgba(40, 24, 16, 0.6); border: 1px solid rgba(242, 196, 107, 0.45);
      border-radius: 999px; padding: 4px 12px; cursor: pointer;
    }
    .level:hover { background: rgba(60, 36, 22, 0.9); }
    /* 等级选择菜单 */
    .level-menu {
      position: fixed; top: 94px; right: 16px; z-index: 4; min-width: 200px;
      background: rgba(28, 18, 34, 0.94); border: 1px solid rgba(242, 196, 107, 0.5);
      border-radius: 14px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .level-menu p { margin: 2px 6px 8px; font-size: 13px; color: var(--ink-soft); }
    .level-option {
      display: flex; align-items: center; gap: 10px; width: 100%;
      font: inherit; font-size: 15px; color: var(--ink); text-align: left;
      background: transparent; border: 1px solid transparent; border-radius: 10px;
      padding: 8px 10px; cursor: pointer;
    }
    .level-option:hover { background: rgba(242, 196, 107, 0.12); }
    .level-option.current { border-color: rgba(242, 196, 107, 0.6); background: rgba(242, 196, 107, 0.16); }
    .level-option .stars { color: var(--amber); letter-spacing: 2px; min-width: 42px; }
    /* 左右换视角的箭头：屏幕两侧垂直居中 */
    .turn {
      position: fixed; top: 50%; transform: translateY(-50%); z-index: 3;
      width: 52px; height: 52px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 28px; line-height: 1; color: var(--amber);
      background: rgba(40, 24, 16, 0.62); border: 1px solid rgba(242, 196, 107, 0.6);
      box-shadow: 0 0 18px rgba(242, 196, 107, 0.25);
      cursor: pointer; transition: background 0.2s, box-shadow 0.2s, opacity 0.2s; opacity: 0.45;
    }
    .turn:hover { opacity: 1; background: rgba(60, 36, 22, 0.88); box-shadow: 0 0 26px rgba(242, 196, 107, 0.5); }
    .turn.left { left: 14px; }
    .turn.right { right: 14px; }
    /* 图书管理员猫头鹰：左下角，蹲在一摞书上，会轻轻晃、会眨眼 */
    .owl {
      position: fixed; left: 14px; bottom: 12px; z-index: 4; width: 92px; height: 108px;
      padding: 0; border: 0; background: none; cursor: pointer;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.45));
      transition: transform 0.2s;
    }
    .owl:hover { transform: scale(1.06); }
    .owl svg { width: 100%; height: 100%; overflow: visible; }
    .owl.art { width: 124px; height: 124px; left: 8px; bottom: 6px; }
    /* 底部提示给左下角的猫头鹰让位：宽屏左右让开；窄屏整体上移到猫头鹰上方 */
    @media (min-width: 700px) { .hint { left: 140px; right: 140px; } }
    @media (max-width: 699px) { .hint { bottom: 140px; left: 16px; right: 16px; } }
    .owl.art .owl-art { width: 100%; height: 100%; object-fit: contain; transform-origin: 50% 90%; animation: owl-bob 3.2s ease-in-out infinite; }
    /* 月球皮肤：猫头鹰戴上宇航员头盔（一个玻璃泡 + 高光 + 银色领圈），跟着猫头鹰一起轻轻浮动 */
    body[data-skin="moon"] .owl::after {
      content: ""; position: absolute; left: 50%; top: 2%; width: 92%; aspect-ratio: 1; transform: translateX(-50%);
      border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 32% 26%, rgba(255,255,255,0.55) 0 7%, rgba(255,255,255,0) 16%),
                  radial-gradient(circle at 50% 50%, rgba(255,240,215,0.05) 0 62%, rgba(255,236,200,0.28) 72%, rgba(255,246,228,0.7) 75%, rgba(255,240,215,0) 77%);   /* 鱼缸式头盔 */
      box-shadow: 0 0 18px rgba(150,190,255,0.35);
      animation: owl-bob 3.2s ease-in-out infinite;
    }
    body[data-skin="moon"] .owl::before {
      content: ""; position: absolute; left: 50%; top: 66%; width: 60%; height: 9%; transform: translateX(-50%);
      border-radius: 40%; background: linear-gradient(#f0d58a, #b8862e); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25), 0 1px 4px rgba(0,0,0,0.3); z-index: 1;   /* 黄铜领圈（未来复古） */
    }
    .skin-menu { right: 16px; left: auto; top: 64px; }
    .level-option.locked { opacity: 0.55; }
    .owl.art.talking .owl-art { animation: owl-tilt 1.6s ease-in-out infinite; }
    .owl .owl-body { transform-origin: 50px 98px; animation: owl-bob 3.2s ease-in-out infinite; }
    .owl.talking .owl-body { animation: owl-tilt 1.6s ease-in-out infinite; }
    .owl .owl-lids { transform-origin: 50px 47px; transform: scaleY(0); animation: owl-blink 4.6s infinite; }
    @keyframes owl-bob { 50% { transform: translateY(-3px) rotate(-2deg); } }
    @keyframes owl-tilt { 50% { transform: rotate(-8deg); } }
    @keyframes owl-blink { 0%, 92%, 100% { transform: scaleY(0); } 95% { transform: scaleY(1); } }
    /* 对话气泡：毛玻璃 */
    .owl-bubble {
      position: fixed; left: 128px; bottom: 70px; z-index: 5; max-width: min(360px, calc(100vw - 130px));
      padding: 12px 14px 10px; border-radius: 16px 16px 16px 4px;
      background: rgba(28, 20, 40, 0.55); color: var(--ink);
      -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%);
      border: 1px solid rgba(242, 196, 107, 0.45); box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      animation: bubble-in 0.3s ease;
    }
    @keyframes bubble-in { from { opacity: 0; transform: translateY(8px) scale(0.96); } }
    .owl-bubble strong { display: block; font-size: 12px; letter-spacing: 0.12em; color: var(--amber); }
    .owl-bubble p { margin: 4px 0 8px; font-size: 16px; line-height: 1.45; }
    .owl-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .owl-choices button, .owl-close {
      font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; text-align: left;
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(242, 196, 107, 0.35);
      border-radius: 10px; padding: 7px 9px;
    }
    .owl-choices button:hover { background: rgba(242, 196, 107, 0.2); }
    .owl-close { margin-top: 8px; font-size: 12px; opacity: 0.7; border: 0; padding: 2px 4px; background: none; }
    .owl-close:hover { opacity: 1; }
    [hidden] { display: none !important; }

    /* 加载幕 & 进入书本时的淡出幕 */
    .veil {
      position: fixed; inset: 0; display: grid; place-items: center; background: var(--night);
      transition: opacity 0.9s, background-color 0.6s; z-index: 5;
    }
    .veil.hidden { opacity: 0; pointer-events: none; }
    .veil.to-book { background: #e9dfc9; opacity: 1; pointer-events: auto; }
    .veil p { color: var(--ink-soft); letter-spacing: 0.3em; font-size: 14px; }
  </style>
  <link rel="stylesheet" href="magic-ui.css">
</head>
<body>
  <canvas id="room" aria-label="The Magic Library. Drag to look around."></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
  <canvas class="sparkles" id="sparkles"></canvas>
  <div class="title" id="title">Magic Library</div>
  <div class="tagline" id="tagline">Find anything you want to read</div>
  <div class="wall-name" id="wall-name"></div>
  <div class="hint" id="hint"></div>
  <div class="toast" id="toast"></div>
  <button type="button" class="turn left" data-icon="chev-left" id="turn-left" aria-label="Turn left">‹</button>
  <button type="button" class="turn right" data-icon="chev-right" id="turn-right" aria-label="Turn right">›</button>
  <button type="button" class="back" data-icon="chev-left" id="back" hidden>← Back to the room</button>
  <div class="section-title" id="section-title" hidden></div>
  <div class="top-right">
    <button type="button" class="music lang" data-icon="music" id="music" aria-label="Music on/off · 音乐开关" aria-pressed="true">♪</button>
    <button type="button" class="lang" id="lang" aria-label="Switch language / 切换语言">中文</button>
    <button type="button" class="music lang" data-icon="sparkle" id="skin" aria-label="Library skins · 换图书馆" aria-haspopup="true">✦</button>
  </div>
  <div class="level-menu skin-menu" id="skin-menu" hidden>
    <p id="skin-menu-title">Choose your library</p>
    <div id="skin-options"></div>
  </div>
  <button type="button" class="level" data-icon="star" id="level" aria-haspopup="true" aria-expanded="false">Level 1</button>
  <div class="level-menu" id="level-menu" hidden>
    <p id="level-menu-title">Choose a reading level</p>
    <div id="level-options"></div>
  </div>
  <div class="veil" id="veil"><p id="veil-text">Lighting the candles…</p></div>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
  <script type="module" src="js/library.js"></script>
</body>
</html>
