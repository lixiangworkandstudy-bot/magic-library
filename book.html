<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>纸艺立体书</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="数据驱动的纸艺立体书运行时。">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <!-- 儿童阅读字体：英文 Andika（SIL 专为初学阅读设计，单层 a / g，易混字母有区分）；中文霞鹜文楷（楷体 = 小学语文课本字形）。两者都是 OFL 开源可商用 -->
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaigbscreen.css">
  <link rel="stylesheet" href="magic-ui.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body class="reader-collapsed">
  <div class="app">
    <main class="stage">
      <canvas id="view" aria-label="立体书画面"></canvas>

      <div class="hud">
        <span class="hud-chapter" id="hud-chapter"></span>
        <strong class="hud-spread" id="hud-spread"></strong>
      </div>

      <div class="caption" id="caption" aria-live="polite"></div>

      <div class="dock">
        <button type="button" class="arrow" data-icon="chev-left" id="nav-prev" aria-label="上一跨页">‹</button>
        <span class="dots" id="nav-dots"></span>
        <span class="counter" id="hud-counter">—</span>
        <button type="button" class="arrow" data-icon="chev-right" id="nav-next" aria-label="下一跨页">›</button>
        <button type="button" class="plain" data-icon="book" id="btn-index" aria-expanded="false">目录</button>
        <button type="button" class="plain" data-icon="sound" id="btn-sound" aria-pressed="true">纸声 开</button>
        <button type="button" class="plain zoom-btn" data-icon="plus" id="btn-zoom-in" aria-label="放大">＋</button>
        <button type="button" class="plain zoom-btn" data-icon="minus" id="btn-zoom-out" aria-label="缩小">－</button>
        <button type="button" class="tilt-toggle" id="tilt-toggle" aria-label="调节书的角度" aria-expanded="false">
        <svg viewBox="0 0 40 40"><path d="M8 32 A24 24 0 0 1 32 8" fill="none" stroke="#e9cf86" stroke-width="1.5" opacity="0.6"/><line id="tilt-mini" x1="8" y1="32" x2="30" y2="32" stroke="#d9b25f" stroke-width="3" stroke-linecap="round"/><circle cx="8" cy="32" r="4" fill="#c8964a"/></svg>
      </button>
        <button type="button" class="plain" data-icon="pin" id="btn-spot" aria-haspopup="true" aria-expanded="false">地点</button>
        <a class="plain" data-icon="library" href="index.html">图书馆</a>
      </div>

      <div class="gate" id="gate">
        <p class="gate-kicker">纸艺立体书</p>
        <h1 class="gate-title" id="gate-title">纸艺立体书</h1>
        <p class="gate-sub" data-book-sub>纸艺 · 立体书</p>
        <button type="button" class="gate-open" data-icon="sparkle" id="gate-open">翻开第一章</button>
        <p class="gate-note" id="gate-note">装订中…</p>

      </div>

      <div class="tilt-dial collapsed" id="tilt-dial" role="slider" aria-label="书的角度" aria-valuemin="0" aria-valuemax="90" tabindex="0"></div>


      <div class="spot-menu" id="spot-menu" hidden>
        <p class="spot-menu-title" id="spot-menu-title">在哪里读？</p>
        <div id="spot-options"></div>
      </div>

      <section class="sheet" id="index" hidden>
        <header class="sheet-head">
          <strong>目 录</strong>
          <button type="button" class="plain" data-icon="close" id="index-close">合上</button>
        </header>
        <div class="sheet-body" id="index-list"></div>
        <footer class="sheet-foot">
          <button type="button" class="plain" id="btn-reset">回到第一跨页</button>
        </footer>
      </section>

      <p class="banner" id="banner" hidden></p>
    </main>

    <aside class="reader">
      <header class="reader-head">
        <span class="reader-kicker">正 文</span>
        <strong id="reader-spread"></strong>
      </header>
      <ol class="passages" id="passages"></ol>
      <footer class="reader-foot">
        <span></span>
      </footer>
    </aside>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
